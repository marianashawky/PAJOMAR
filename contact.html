<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
  <meta charset="UTF-8">
  <script>try{if(localStorage.getItem('pajomar-theme')==='dark')document.documentElement.classList.add('theme-dark')}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact PAJOMAR for curtain consultations, custom quotes and professional installation. We're here to help transform your space.">
  <title>Contact — PAJOMAR</title>
  <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-i18n-title="page.title.contact">

  <div id="page-loader" class="page-loader" role="status" aria-label="PAJOMAR" aria-busy="true">
    <div class="page-loader__inner" aria-hidden="true">
      <span class="page-loader__ring"></span>
      <span class="page-loader__ring page-loader__ring--delay"></span>
      <div class="page-loader__mark"><span class="page-loader__letter">P</span></div>
      <div class="page-loader__folds"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="page-hero">
    <div class="container">
      <h1 class="display-lg" data-i18n="contact.title">Contact</h1>
      <p data-i18n="contact.desc">We'd love to hear about your project. Reach out for consultations, quotes or any questions.</p>
    </div>
  </div>

  <div class="container">
    <div class="contact-grid">
      <div class="contact-info fade-in">
        <h3 class="display-md" data-i18n="contact.getInTouch">Get in Touch</h3>
        <div class="contact-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <div>
            <strong data-i18n="contact.showroom">Showroom</strong>
            <p class="text-muted"><span data-i18n="contact.showroomAddr">123 Design Avenue, Interior District</span><br><span data-i18n="contact.showroomHours">Open Mon–Sat, 10am – 6pm</span></p>
          </div>
        </div>
        <div class="contact-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
          <div>
            <strong data-i18n="contact.phone">Phone</strong>
            <p class="text-muted">+1 (555) 123-4567</p>
          </div>
        </div>
        <div class="contact-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
          <div>
            <strong data-i18n="contact.email">Email</strong>
            <p class="text-muted">hello@pajomar.com</p>
          </div>
        </div>
        <div class="contact-item">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          <div>
            <strong data-i18n="contact.whatsapp">WhatsApp</strong>
            <p class="text-muted"><a href="https://wa.me/WHATSAPP_NUMBER" target="_blank" rel="noopener" style="color:var(--primary)" data-i18n="contact.whatsappLink">Chat with us instantly</a></p>
          </div>
        </div>
      </div>

      <form class="contact-form fade-in" id="quote">
        <h3 class="display-md" style="margin-bottom:24px" data-i18n="contact.formTitle">Request a Quote</h3>
        <div class="form-group">
          <label for="name" data-i18n="contact.name">Full Name</label>
          <input type="text" id="name" name="name" required data-i18n-placeholder="contact.namePlaceholder">
        </div>
        <div class="form-group">
          <label for="email" data-i18n="contact.emailLabel">Email Address</label>
          <input type="email" id="email" name="email" required data-i18n-placeholder="contact.emailPlaceholder">
        </div>
        <div class="form-group">
          <label for="phone" data-i18n="contact.phoneLabel">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
        </div>
        <div class="form-group">
          <label for="interest" data-i18n="contact.interest">I'm Interested In</label>
          <select id="interest" name="interest">
            <option value="" data-i18n="contact.selectOption">Select an option</option>
            <option value="curtains" data-i18n="contact.optCurtains">Ready-Made Curtains</option>
            <option value="custom" data-i18n="contact.optCustom">Custom Curtains</option>
            <option value="consultation" data-i18n="contact.optConsultation">Design Consultation</option>
            <option value="installation" data-i18n="contact.optInstallation">Installation</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message" data-i18n="contact.message">Tell Us About Your Project</label>
          <textarea id="message" name="message" data-i18n-placeholder="contact.messagePlaceholder"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="contact.submit">Submit Request</button>
      </form>
    </div>
  </div>

  <script src="js/images-manifest.js"></script>
  <script src="js/image-lib.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.querySelector('.contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert(I18n.t('contact.thankYou'));
      e.target.reset();
    });
  </script>
</body>
</html>
